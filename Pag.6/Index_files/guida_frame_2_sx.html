<head>
    <meta charset="UTF-8">

    <title>Página Chida 😎</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Helvetica', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            padding: 20px;
        }

        h3 {
            font-size: 2.5rem;
            color: #ff6f61;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        ol {
            list-style: none;
            padding: 0;
            margin: 0 auto;
            max-width: 600px;
        }

        ol li {
            margin: 15px 0;
        }

        ol li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 1.2rem;
            padding: 10px 20px;
            background-color: #333;
            border-radius: 25px;
            display: inline-block;
            width: 80%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        ol li a:hover {
            background-color: #ff6f61;
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(255, 111, 97, 0.4);
        }

        .audio-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        audio {
            width: 100%;
            max-width: 300px;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        #play-audio {
            background-color: #ff6f61;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        #play-audio:hover {
            background-color: #e65a50;
        }
    </style>
</head>
