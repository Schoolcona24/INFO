<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página Web - Noe Israel</title>
  <style>
    /* Estilos generales */
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      font-family: 'Montserrat', sans-serif;
      color: white;
      text-align: center;
    }

    /* Contenedor del banner */
    .banner {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1000px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 0;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    }

    /* Estilos del texto en el banner */
    .banner h1 {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00d4ff;
    }

    /* Ajuste del contenido */
    .content {
      padding-top: 100px;
    }

    /* Botón atractivo */
    .btn {
      display: inline-block;
      background: #00d4ff;
      color: #fff;
      padding: 12px 20px;
      margin-top: 20px;
      font-size: 18px;
      border-radius: 25px;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0084a8;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Banner -->
  <div class="banner">
    <h1>Páginas de Motos Good - Creado por 🥵Noe Israel Tun Tamay🥵</h1>
  </div>

  <div class="content">
    <h2>Bienvenido a mi sitio web</h2>
    <p>Descubre todo sobre motos con el mejor diseño.</p>
    <a href="#" class="btn">Explorar</a>
  </div>

</body>
</html>
